        function drawTrait() {
            const choice = Math.random();
            if (choice < 0.25) return 'yang';
            if (choice < 0.5) return 'yin';
            if (choice < 0.75) return 'yChang';
            return 'yiChang';
        }

        function traitToIndex(trait) {
            return (trait === 'yang' || trait === 'yChang') ? 1 : 0;
        }

        function calculateTrigram(traits) {
    const line1 = traitToIndex(traits[0]); // trait du bas
    const line2 = traitToIndex(traits[1]);
    const line3 = traitToIndex(traits[2]); // trait du haut
    return (line1 * 4) + (line2 * 2) + line3;

        }

        function sym(n) {
            return String.fromCodePoint(0x4DC0 + n - 1);
        }

        function hasChangingTraits(t1, t2) {
            return [...t1, ...t2].some(t => t === 'yChang' || t === 'yiChang');

const TABLE_URL = 'https://albator-78.github.io/modalyiking/';

// Hexagramme relatif : chaque trait changeant s'inverse
function hexRelatif() {
  const flip = t => t === 'yChang' ? 'yin' : t === 'yiChang' ? 'yang' : t;
  const lo = calculateTrigram(state.traits1.map(flip));
  const up = calculateTrigram(state.traits2.map(flip));
  return GRID[lo][up];
}

function lienTable() {
  const u = new URL(TABLE_URL);
  u.searchParams.set('hex', state.hexNum);
  if (hasChangingTraits(state.traits1, state.traits2)) {
    const r = hexRelatif();
    if (r !== state.hexNum) u.searchParams.set('vers', r);
  }
  return u.toString();
}

                            <div class="oracle-section">
                                <div class="oracle-section-title">🔮 Guidance Mystique Personnalisée</div>

                                    <strong style="color: #FFD700;">Votre moment présent</strong> est gouverné par l'interaction entre <strong>${tri1.fr}</strong> (fondement) 
                                    et <strong>${tri2.fr}</strong> (manifestation). L'équilibre entre ces forces détermine votre chemin. 
                                    ${hasChanging ? `<em style="color: #FF00FF;">Les traits changeants indiquent que vous êtes en période de transformation profonde.</em>` : ''}
                                    Écoutez l'univers, suivez les signes subtils, et acceptez la sagesse profonde que cet oracle révèle à votre conscience.
                                </div>
                            </div>
                        </div>

                        <a class="btn-table" href="${lienTable()}" target="_blank" rel="noopener">☯ Jugement &amp; Commentaire dans la Table Périodique</a>

                        <button onclick="reset()" style="margin-top: 20px;">🔄 ✦ Consulter un Nouvel Oracle ✦ 🔄</button>
                    </div>
                `;

                content.innerHTML = html;
            }
        }

        function drawTraitStep() {
            const phase = state.phase === 'tri1' ? 'traits1' : 'traits2';
            const trait = drawTrait();
            state[phase].push(trait);
            render();
        }

        function selectTraitVariant(idx, variant) {
            const phase = state.phase === 'tri1' ? 'traits1' : 'traits2';
            state[phase][idx] = variant;
            render();
        }

        function startPhase1() {
            state.phase = 'tri1';
            state.traits1 = [];
            render();
        }

        function startPhase2() {
            state.phase = 'tri2';
            state.traits2 = [];
            render();
        }

        function showFinalHexagram() {
            state.phase = 'final';
            render();
        }

        function reset() {
            state = {
                phase: 'start',
                traits1: [],
                traits2: [],
                hexNum: null
            };
            window.scrollTo({ top: 0, behavior: 'smooth' });
            render();
        }

        render();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW'));
        }
    </script>
