<style>
*{margin:0;padding:0;box-sizing:border-box}

.ln{display:flex;gap:16%;height:16px}

.trigram-display{background:rgba(100,200,150,.15);border:2px dashed rgba(255,215,0,.4);border-radius:12px;padding:18px;margin:20px auto;max-width:560px;text-align:center}
.trigram-display .label{font-size:.9rem;color:#FFD700;margin-bottom:8px}

.hexagram-final{background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(200,100,0,.15));border:3px solid #FFD700;padding:28px 22px;max-width:820px;margin:0 auto}
.kicker{font-size:.9rem;color:#FFD700;letter-spacing:2px;margin-bottom:14px}

.hexagram-info{background:rgba(0,0,0,.2);border-radius:10px;padding:14px;margin:14px 0;text-align:left}

.oracle-interpretation{background:rgba(0,0,0,.2);border-radius:15px;border-left:4px solid #FFD700;padding:22px;margin:18px 0;text-align:left}

.oracle-section-title{font-size:1.05rem;color:#FFD700;font-weight:bold;margin-bottom:10px}
.oracle-text{font-size:.95rem;color:rgba(255,255,255,.88);line-height:1.8;max-width:70ch;-webkit-user-select:text;user-select:text}
.oracle-text strong{color:#FFB6FF}
.oracle-text em{color:#FF9FF3}
.btn-table{display:block;margin:16px auto 0;width:90%;max-width:400px;padding:14px 20px;text-align:center;text-decoration:none;font-weight:bold;color:#FFD700;border:2px solid #FFD700;border-radius:30px;background:rgba(255,215,0,.1);font-family:Georgia,serif}
.btn-table:hover{background:rgba(255,215,0,.25)}
.btn-ghost{background:transparent;color:#FFD700;border:2px solid rgba(255,215,0,.6);box-shadow:none;font-size:.9rem;padding:12px 24px}

<body>
<div class="container">
  <header>
    <h1>🔮 Oracle Yi Ching Complet 🔮</h1>
    <p class="subtitle">Les 64 hexagrammes du destin, avec interprétations enrichies</p>
    <p class="subtitle">Traits changeants en magenta • tirage aux pièces ou aux tiges d'achillée</p>
    <div class="phase-counter" id="phaseCounter">PRÊT À CONSULTER</div>
  </header>
  <div id="content"></div>
</div>

<!-- Les 64 textes d'interprétation : fichier hexagrammes.js (const HEXAGRAMS = {...}) -->
<script src="hexagrammes.js"></script>
<script>
// ========== TRIGRAMMES ==========
const TRIGRAMS = [
  { symbol:'☷', pinyin:'Kūn',  fr:'Terre',    desc:'Réceptif, stable, mère',          element:'Terre', emoji:'🟫', direction:'Sud-Ouest' },
  { symbol:'☶', pinyin:'Gèn',  fr:'Montagne', desc:'Immobilité, repos, arrêt',        element:'Terre', emoji:'🟫', direction:'Nord-Est' },
  { symbol:'☵', pinyin:'Kǎn',  fr:'Eau',      desc:'Profondeur, danger, abîme',       element:'Eau',   emoji:'💧', direction:'Nord' },
  { symbol:'☴', pinyin:'Xùn',  fr:'Vent',     desc:'Pénétration, douceur, grâce',     element:'Bois',  emoji:'🌳', direction:'Sud-Est' },
  { symbol:'☳', pinyin:'Zhèn', fr:'Tonnerre', desc:'Mouvement, choc, éveil',          element:'Bois',  emoji:'🌳', direction:'Est' },
  { symbol:'☲', pinyin:'Lí',   fr:'Feu',      desc:'Clarté, chaleur, illumination',   element:'Feu',   emoji:'🔥', direction:'Sud' },
  { symbol:'☱', pinyin:'Duì',  fr:'Lac',      desc:'Joie, échange, convivialité',     element:'Métal', emoji:'⚪', direction:'Ouest' },
  { symbol:'☰', pinyin:'Qián', fr:'Ciel',     desc:'Créatif, actif, père, force',     element:'Métal', emoji:'⚪', direction:'Nord-Ouest' }
];

// Grille : ligne = trigramme inférieur, colonne = trigramme supérieur (ordre ☷ ☶ ☵ ☴ ☳ ☲ ☱ ☰)
const GRID = [
  [2,23,8,20,16,35,45,12],
  [15,52,39,53,62,56,31,33],
  [7,4,29,59,40,64,47,6],
  [46,18,48,57,32,50,28,44],
  [24,27,3,42,51,21,17,25],
  [36,22,63,37,55,30,49,13],
  [19,41,60,61,54,38,58,10],
  [11,26,5,9,34,14,43,1]
];

// ========== DONNÉES : corrections automatiques ==========
if (typeof HEXAGRAMS === 'undefined') { window.HEXAGRAMS = {}; }
(function corrigerDonnees() {
  const trad = { '讼':'訟', '师':'師', '离':'離', '兑':'兌', '既济':'既濟', '未济':'未濟' };
  Object.values(HEXAGRAMS).forEach(h => {
    if (h.image && trad[h.image]) h.image = trad[h.image];
    Object.keys(h).forEach(k => {
      if (typeof h[k] === 'string') h[k] = h[k].replace(/Savoupaz/g, 'Savourez');
    });
  });
})();

// ========== TRAITS ==========
// 6 = yin mutant · 7 = yang stable · 8 = yin stable · 9 = yang mutant
const VALEUR_TO_TRAIT = { 6:'yiChang', 7:'yang', 8:'yin', 9:'yChang' };
const TRAIT_TO_VALEUR = { yiChang:6, yang:7, yin:8, yChang:9 };
const TRAITS = {
  yang:    { name:'Yang stable',   v:7 },
  yin:     { name:'Yin stable',    v:8 },
  yChang:  { name:'Yang changeant', v:9 },
  yiChang: { name:'Yin changeant',  v:6 }
};
const estMutant = t => t === 'yChang' || t === 'yiChang';

// ========== TIRAGES ==========
// Trois pièces : face = 3, pile = 2. Total 6 à 9.
function tirerPieces() {
  const detail = [0,0,0].map(() => Math.random() < 0.5 ? 3 : 2);
  return { valeur: detail.reduce((a,b) => a+b, 0), detail };
}
// Achillée : 49 tiges, trois « changements ». On retire 5 ou 9, puis 4 ou 8, puis 4 ou 8.
// P(5)=3/4 au premier, P(4)=1/2 aux suivants. Reste/4 = 6, 7, 8 ou 9.
function tirerAchillee() {
  const c1 = Math.random() < 0.75 ? 5 : 9;
  const c2 = Math.random() < 0.5 ? 4 : 8;
  const c3 = Math.random() < 0.5 ? 4 : 8;
  return { valeur: (49 - c1 - c2 - c3) / 4, detail: [c1, c2, c3] };
}
function libelleTirage(e) {
  if (!e) return '';
  if (e.mode === 'manuel') return 'saisie manuelle';
  if (e.mode === 'achillee') return 'tiges retirées : ' + e.detail.join(' + ') + ' → ' + e.valeur;
  return e.detail.map(v => v === 3 ? 'face' : 'pile').join(' · ') + ' → ' + e.valeur;
}

// ========== ÉTAT ==========
let state = { phase:'start', mode:'pieces', traits1:[], traits2:[], hexNum:null, journal:[] };

const tousTraits = () => [...state.traits1, ...state.traits2];
const hasChanging = () => tousTraits().some(estMutant);
const lignesMutantes = () => tousTraits().map((t,i) => estMutant(t) ? i+1 : 0).filter(Boolean);

function calculerTrigramme(traits) {
  const b = t => (t === 'yang' || t === 'yChang') ? 1 : 0;
  return b(traits[0]) * 4 + b(traits[1]) * 2 + b(traits[2]);   // trait du bas = poids fort
}
const sym = n => String.fromCodePoint(0x4DC0 + n - 1);

function hexRelatif() {
  const flip = t => t === 'yChang' ? 'yin' : t === 'yiChang' ? 'yang' : t;
  return GRID[calculerTrigramme(state.traits1.map(flip))][calculerTrigramme(state.traits2.map(flip))];
}
function donneesHex(n) {
  return HEXAGRAMS[n] || { name:'Hexagramme ' + n, tarot:'', image:'', theme:'', meaning:'',
    interpretation:"Les textes de cet hexagramme n'ont pas été chargés (fichier hexagrammes.js manquant ?)." };
}

// ========== WU XING ==========
const WUXING = {
  'Bois':{nourrit:'Feu',controle:'Terre'}, 'Feu':{nourrit:'Terre',controle:'Métal'},
  'Terre':{nourrit:'Métal',controle:'Eau'}, 'Métal':{nourrit:'Eau',controle:'Bois'},
  'Eau':{nourrit:'Bois',controle:'Feu'}
};
function relationElements(bas, haut) {
  if (bas === haut) return `Harmonie d'identité (${bas} sur ${bas}) : résonance et amplification de l'élément.`;
  if (WUXING[bas].nourrit === haut)  return `Cycle d'engendrement (Shēng) : le fondement (${bas}) nourrit la manifestation (${haut}).`;
  if (WUXING[haut].nourrit === bas)  return `Cycle de retour : l'extérieur (${haut}) ressource la base intérieure (${bas}).`;
  if (WUXING[bas].controle === haut) return `Cycle de contrôle (Kè) : l'élan intérieur (${bas}) maîtrise l'extérieur (${haut}).`;
  if (WUXING[haut].controle === bas) return `Cycle de contrainte : le contexte extérieur (${haut}) met la base (${bas}) à l'épreuve.`;
  return '';
}
function analyserWuXing(tri1, tri2) {
  const codes = tousTraits().map(t => TRAIT_TO_VALEUR[t]);
  let mutation = 'Aucune ligne mutante : la structure élémentaire reste fixe.';
  if (hasChanging()) {
    const flip = t => t === 'yChang' ? 'yin' : t === 'yiChang' ? 'yang' : t;
    const r1 = TRIGRAMS[calculerTrigramme(state.traits1.map(flip))];
    const r2 = TRIGRAMS[calculerTrigramme(state.traits2.map(flip))];
    mutation = `${tri1.emoji} ${tri1.element} / ${tri2.emoji} ${tri2.element} devient ${r1.emoji} ${r1.element} / ${r2.emoji} ${r2.element}.`;
  }
  return { codes: codes.join(' · '), dynamique: relationElements(tri1.element, tri2.element), mutation };
}

// ========== LIENS ==========
const TABLE_URL = 'https://albator-78.github.io/modalyiking/';
function lienTable() {
  const u = new URL(TABLE_URL);
  u.searchParams.set('hex', state.hexNum);
  if (hasChanging()) { const r = hexRelatif(); if (r !== state.hexNum) u.searchParams.set('vers', r); }
  return u.toString();
}
  function lienTarotBagua() {
  const u = new URL(TAROT_BAGUA_URL);

  u.searchParams.set('hex', state.hexNum);

  if (hasChanging()) {
    const relatif = hexRelatif();

    if (relatif !== state.hexNum) {
      u.searchParams.set('vers', relatif);
    }
  }

  return u.toString();
}

  const TAROT_BAGUA_URL =
  'https://albator-78.github.io/tarot-bagua/';

  
function lienWengu() {
  const code = { yiChang:'6', yang:'7', yin:'8', yChang:'9' };
  return `http://wengu.tartarie.com/wg/wengu.php?l=Yijing&tire=${tousTraits().map(t => code[t]).join('')}&no=${state.hexNum}&lang=fr`;
}
function lienPartage() {
  const p = new URLSearchParams({ hex: state.hexNum });
  if (hasChanging()) { const r = hexRelatif(); if (r !== state.hexNum) p.set('vers', r); }
  return location.origin + location.pathname + '?' + p;
}
function copierLien() {
  const url = lienPartage();
  const ok = () => { const b = document.getElementById('btnCopie'); if (b) b.textContent = '✔ Lien copié'; };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(ok, () => prompt('Copiez ce lien :', url));
  else prompt('Copiez ce lien :', url);
}

// ========== AFFICHAGE ==========
function ligneHTML(trait, num, entree) {
  const mut = estMutant(trait), yin = trait === 'yin' || trait === 'yiChang';
  const note = entree ? libelleTirage(entree) : '';
  return `<div class="row ${mut ? 'mut' : ''}">
    <span class="n">${num}</span>
    <div class="ln ${mut ? 'mut' : ''}" role="img" aria-label="Ligne ${num} : ${TRAITS[trait].name}">${yin ? '<i></i><i></i>' : '<i></i>'}</div>
    ${note || mut ? `<small>${TRAITS[trait].name} (${TRAITS[trait].v})${note ? ' — ' + note : ''}</small>` : ''}
  </div>`;
}

function render() {
  const content = document.getElementById('content');
  const counter = document.getElementById('phaseCounter');

  if (state.phase === 'start') {
    counter.textContent = 'PRÊT À CONSULTER';
    const aide = {
      pieces:   "Trois pièces lancées par ligne : face vaut 3, pile vaut 2. Les valeurs extrêmes (6 et 9) sont les lignes mutantes. Chaque ligne a 1 chance sur 8 d'être un 6 ou un 9.",
      achillee: "Quarante-neuf tiges divisées trois fois par ligne : méthode ancienne, plus lente. Elle favorise le yang mutant (9) sur le yin mutant (6) : 3 contre 1.",
      manuel:   "Vous avez tiré vos lignes vous-même (pièces réelles, tiges). Saisissez la valeur obtenue pour chaque ligne, du bas vers le haut."
    }[state.mode];
    content.innerHTML = `
      <div class="initial-message">
        <div class="initial-emoji">🔮 ☯️ 🔮</div>
        <h2 class="initial-title">Oracle complet du Yi Ching</h2>
        <p class="initial-text">Construisez votre hexagramme ligne par ligne, du bas vers le haut, puis recevez l'interprétation, la dynamique des cinq éléments et l'hexagramme vers lequel vous allez.</p>
        <div class="mode-title">Méthode de tirage</div>
        <div class="btn-options">
          <button class="btn-option ${state.mode==='pieces'?'selected':''}" onclick="setMode('pieces')">🪙 Trois pièces<small>rapide</small></button>
          <button class="btn-option ${state.mode==='achillee'?'selected':''}" onclick="setMode('achillee')">🌿 Tiges d'achillée<small>traditionnelle</small></button>
          <button class="btn-option ${state.mode==='manuel'?'selected':''}" onclick="setMode('manuel')">✍️ Saisie manuelle<small>vos propres lignes</small></button>
        </div>
        <p class="mode-help">${aide}</p>
        <div class="trait-legend" style="margin-top:22px">
          <div class="legend-item">7 · yang stable</div>
          <div class="legend-item">8 · yin stable</div>
          <div class="legend-item legend-changing">9 · yang changeant</div>
          <div class="legend-item legend-changing">6 · yin changeant</div>
        </div>
      </div>
      <button onclick="startPhase1()" style="margin-top:28px">🎲 Consulter l'oracle</button>`;
    return;
  }

  if (state.phase === 'tri1' || state.phase === 'tri2') {
    const num = state.phase === 'tri1' ? 1 : 2;
    const traits = num === 1 ? state.traits1 : state.traits2;
    const offset = num === 1 ? 0 : 3;
    counter.textContent = `TRIGRAMME ${num === 1 ? 'INFÉRIEUR' : 'SUPÉRIEUR'} · LIGNES ${offset+1} À ${offset+3}`;

    const lignes = traits.length
      ? traits.map((t,i) => ligneHTML(t, offset+i+1, state.journal[offset+i])).join('')
      : `<p class="empty">En attente de la ligne ${offset+1}…</p>`;

    let action = '';
    if (traits.length < 3) {
      const prochaine = offset + traits.length + 1;
      action = state.mode === 'manuel'
        ? `<div class="mode-title">Valeur de la ligne ${prochaine}</div>
           <div class="btn-options">
             <button class="btn-option mut" onclick="ajouterLigne(6)">6<small>yin changeant</small></button>
             <button class="btn-option" onclick="ajouterLigne(7)">7<small>yang stable</small></button>
             <button class="btn-option" onclick="ajouterLigne(8)">8<small>yin stable</small></button>
             <button class="btn-option mut" onclick="ajouterLigne(9)">9<small>yang changeant</small></button>
           </div>`
        : `<p class="count">${traits.length} / 3 lignes</p>
           <button onclick="tirerLigne()">${state.mode === 'achillee' ? '🌿 Diviser les tiges' : '🪙 Lancer les pièces'} · ligne ${prochaine}</button>`;
    }

    let trig = '';
    if (traits.length === 3) {
      const t = TRIGRAMS[calculerTrigramme(traits)];
      trig = `<div class="trigram-display">
          <div class="label">Trigramme ${num === 1 ? 'inférieur' : 'supérieur'}</div>
          <div class="trigram-symbol">${t.symbol}</div>
          <div class="trigram-name">${t.pinyin}</div>
          <div class="trigram-french">${t.fr}</div>
          <div class="trigram-desc">${t.desc}</div>
        </div>
        ${num === 1 ? `<button onclick="startPhase2()">Tirer le trigramme supérieur</button>`
                    : `<button onclick="showFinalHexagram()">✦ Révéler l'oracle ✦</button>`}`;
    }

    content.innerHTML = `<div class="construction-zone">
        <div class="construction-title">Trigramme ${num === 1 ? 'inférieur' : 'supérieur'}</div>
        <div class="traits-display">${lignes}</div>
        ${action}
      </div>${trig}`;
    return;
  }

  // ----- Phase finale -----
  counter.textContent = "L'ORACLE EST RÉVÉLÉ";
  const tri1 = TRIGRAMS[calculerTrigramme(state.traits1)];
  const tri2 = TRIGRAMS[calculerTrigramme(state.traits2)];
  state.hexNum = GRID[calculerTrigramme(state.traits1)][calculerTrigramme(state.traits2)];
  const h = donneesHex(state.hexNum);
  const mut = hasChanging();
  const wx = analyserWuXing(tri1, tri2);

  let bloc = '';
  if (mut) {
    const r = hexRelatif(), hr = donneesHex(r);
    bloc = `<div class="changing-indicator">
        <strong>Lignes mutantes : ${lignesMutantes().join(', ')}</strong> (numérotées du bas vers le haut)<br>
        Hexagramme relatif : ${sym(r)} n°${r} — ${hr.name}${hr.image ? ' (' + hr.image + ')' : ''}.<br>
        Lisez d'abord l'hexagramme principal, puis le texte de chaque ligne mutante, puis l'hexagramme relatif : il décrit la direction que prend la situation.
      </div>`;
  }

  const journal = state.journal.length === 6
    ? `<div class="oracle-section"><div class="oracle-section-title">Votre tirage</div>
         <div class="journal">${state.journal.map((e,i) => `Ligne ${i+1} : ${libelleTirage(e)} (${TRAITS[VALEUR_TO_TRAIT[e.valeur]].name})`).join('<br>')}</div></div>`
    : '';

  content.innerHTML = `
    <div class="hexagram-final">
      <div class="kicker">✦ L'ORACLE ✦</div>
      <div class="hexagram-symbol">${sym(state.hexNum)}</div>
      <div class="hexagram-title">${h.name}</div>
      <div class="hexagram-sub">Hexagramme n°${state.hexNum}${h.image ? ' · ' + h.image : ''}${h.theme ? ' · ' + h.theme : ''}</div>
      ${h.meaning ? `<div class="hexagram-meaning">${h.meaning}</div>` : ''}

      <div class="hexagram-info">
        ${h.tarot ? `<div class="info-line"><span class="info-label">Arcane de tarot :</span> ${h.tarot}</div>` : ''}
        <div class="info-line"><span class="info-label">Trigramme inférieur :</span> ${tri1.symbol} ${tri1.pinyin} (${tri1.fr})</div>
        <div class="info-line"><span class="info-label">Trigramme supérieur :</span> ${tri2.symbol} ${tri2.pinyin} (${tri2.fr})</div>
        <div class="info-line"><span class="info-label">Lignes, du bas vers le haut :</span> ${wx.codes}</div>
        <div class="info-line"><span class="info-label">Éléments et directions :</span> ${tri1.emoji} ${tri1.element} (${tri1.direction}) → ${tri2.emoji} ${tri2.element} (${tri2.direction})</div>
        <div class="info-line"><span class="info-label">Dynamique Wu Xing :</span> ${wx.dynamique}</div>
        <div class="info-line"><span class="info-label">Évolution des lignes mutantes :</span> ${wx.mutation}</div>
      </div>

      ${bloc}

      <div class="oracle-interpretation">
        <div class="oracle-section"><div class="oracle-section-title">✨ Interprétation</div><div class="oracle-text">${h.interpretation}</div></div>
        ${h.advice ? `<div class="oracle-section"><div class="oracle-section-title">🌟 Conseil</div><div class="oracle-text">${h.advice}</div></div>` : ''}
        ${h.warning ? `<div class="oracle-section"><div class="oracle-section-title">⚠️ Mise en garde</div><div class="oracle-text">${h.warning}</div></div>` : ''}
        <div class="oracle-section"><div class="oracle-section-title">🔮 Lecture des éléments</div>
          <div class="oracle-text">Votre situation naît de la rencontre entre <strong>${tri1.fr}</strong> (le fondement) et <strong>${tri2.fr}</strong> (ce qui se manifeste). ${wx.dynamique}${mut ? ' <em>Des lignes sont en mouvement : la situation est en train de se transformer.</em>' : ''}</div></div>
        ${journal}
      </div>

      <a class="btn-table" href="${lienTable()}" target="_blank" rel="noopener">☯ Jugement et commentaire dans la table périodique</a>
      <a
  class="btn-table"
  href="${lienTarotBagua()}"
  target="_blank"
  rel="noopener"
>
  🃏 Correspondances Tarot · Ba Gua · Wu Xing
</a>

      <a class="btn-table" href="${lienWengu()}" target="_blank" rel="noopener">📜 Texte et lignes mutantes sur Wengu (n°${state.hexNum})</a>
      <button id="btnCopie" class="btn-ghost" onclick="copierLien()" style="margin-top:22px">Copier le lien de ce tirage</button>
      <button onclick="reset()">🔄 Nouvelle consultation</button>
    </div>`;
}

// ========== ACTIONS ==========
function setMode(m) { state.mode = m; render(); }

function ajouterLigne(valeur, detail) {
  const cle = state.phase === 'tri1' ? 'traits1' : 'traits2';
  if (state[cle].length >= 3) return;
  state[cle].push(VALEUR_TO_TRAIT[valeur]);
  state.journal.push({ valeur, detail: detail || [], mode: state.mode });
  render();
}
function tirerLigne() {
  const t = state.mode === 'achillee' ? tirerAchillee() : tirerPieces();
  ajouterLigne(t.valeur, t.detail);
}

function startPhase1() { state.phase = 'tri1'; state.traits1 = []; state.traits2 = []; state.journal = []; render(); }
function startPhase2() { state.phase = 'tri2'; state.traits2 = []; render(); }
function showFinalHexagram() {
  state.phase = 'final';
  render();
  const p = new URLSearchParams({ hex: state.hexNum });
  if (hasChanging()) { const r = hexRelatif(); if (r !== state.hexNum) p.set('vers', r); }
  history.replaceState(null, '', '?' + p);
}
function reset() {
  state = { phase:'start', mode:state.mode, traits1:[], traits2:[], hexNum:null, journal:[] };
  history.replaceState(null, '', location.pathname);
  window.scrollTo({ top:0, behavior:'smooth' });
  render();
}

// ========== OUVERTURE PAR LIEN (?hex=47&vers=6) ==========
function traitsDepuisHex(n, m) {
  const pos = h => { for (let lo = 0; lo < 8; lo++) for (let up = 0; up < 8; up++) if (GRID[lo][up] === h) return [lo, up]; };
  const bits = h => { const [lo, up] = pos(h); return [(lo>>2)&1,(lo>>1)&1,lo&1,(up>>2)&1,(up>>1)&1,up&1]; };
  const a = bits(n), b = m ? bits(m) : a;
  const t = a.map((v,i) => v === b[i] ? (v ? 'yang' : 'yin') : (v ? 'yChang' : 'yiChang'));
  return [t.slice(0,3), t.slice(3)];
}
(function () {
  const q = new URLSearchParams(location.search);
  const n = parseInt(q.get('hex'), 10), m = parseInt(q.get('vers'), 10);
  if (!(n >= 1 && n <= 64)) return;
  const [t1, t2] = traitsDepuisHex(n, (m >= 1 && m <= 64 && m !== n) ? m : null);
  state.traits1 = t1; state.traits2 = t2; state.phase = 'final';
})();

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
